<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 365 450" width="100%" height="100%" xml:space="preserve">
  <defs>
    <!-- Soft Glow Filter for Chest Ring -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Helmet 3D Spherical Radial Gradient -->
    <radialGradient id="helmetGrad" cx="36%" cy="26%" r="74%">
      <stop offset="0%" stop-color="#FFA057"/>
      <stop offset="30%" stop-color="#F57624"/>
      <stop offset="68%" stop-color="#E85813"/>
      <stop offset="100%" stop-color="#C24004"/>
    </radialGradient>

    <!-- Torso 3D Radial Gradient -->
    <radialGradient id="torsoGrad" cx="42%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FF9B54"/>
      <stop offset="38%" stop-color="#F47220"/>
      <stop offset="72%" stop-color="#E25410"/>
      <stop offset="100%" stop-color="#B83904"/>
    </radialGradient>

    <!-- Earmuff Left Linear Gradient -->
    <linearGradient id="earmuffLGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D64805"/>
      <stop offset="45%" stop-color="#F57624"/>
      <stop offset="100%" stop-color="#FFA057"/>
    </linearGradient>

    <!-- Earmuff Right Linear Gradient -->
    <linearGradient id="earmuffRGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA057"/>
      <stop offset="55%" stop-color="#F57624"/>
      <stop offset="100%" stop-color="#D64805"/>
    </linearGradient>

    <!-- Visor Faceplate Screen Gradient -->
    <linearGradient id="screenGrad" x1="25%" y1="15%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="32%" stop-color="#F6FAFD"/>
      <stop offset="68%" stop-color="#E5F1F9"/>
      <stop offset="100%" stop-color="#CEE4F4"/>
    </linearGradient>

    <!-- Navy Visor Collar Ring Gradient -->
    <linearGradient id="navyCollarGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#366196"/>
      <stop offset="50%" stop-color="#24456D"/>
      <stop offset="100%" stop-color="#162D4A"/>
    </linearGradient>

    <!-- Peach Bezel Rim Gradient -->
    <linearGradient id="peachBezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBEA3"/>
      <stop offset="40%" stop-color="#F78C5E"/>
      <stop offset="100%" stop-color="#EB6931"/>
    </linearGradient>

    <!-- Metallic Hose Tube Gradient -->
    <linearGradient id="metalHoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="30%" stop-color="#CBD5E1"/>
      <stop offset="65%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Navy Glove Gradient -->
    <linearGradient id="navyGloveGrad" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#3A6498"/>
      <stop offset="50%" stop-color="#264771"/>
      <stop offset="100%" stop-color="#183150"/>
    </linearGradient>

    <!-- Boot Upper Gradient -->
    <radialGradient id="bootGrad" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFA057"/>
      <stop offset="45%" stop-color="#F5701E"/>
      <stop offset="85%" stop-color="#DF4E09"/>
      <stop offset="100%" stop-color="#B83904"/>
    </radialGradient>

    <!-- Boot Sole Gradient -->
    <linearGradient id="bootSoleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. BACK ELEMENTS: EARMUFFS (NO OUTLINE)                  -->
  <!-- ======================================================== -->
  <!-- Left Earmuff: x: 1..42, y: 126..196 -->
  <g id="earmuff-left">
    <path d="M 18 126 L 36 126 C 41 126 43 130 43 136 L 43 186 C 43 192 41 196 36 196 L 18 196 C 7 196 1 185 1 174 L 1 148 C 1 137 7 126 18 126 Z"
          fill="url(#earmuffLGrad)"/>
    <!-- Subtle inner crease -->
    <path d="M 28 138 C 21 150 21 172 28 184" fill="none" stroke="#B83904" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Right Earmuff: x: 280..323, y: 128..198 -->
  <g id="earmuff-right">
    <path d="M 283 128 L 305 128 C 316 128 323 139 323 150 L 323 176 C 323 187 316 198 305 198 L 283 198 C 278 198 276 194 276 188 L 276 138 C 276 132 278 128 283 128 Z"
          fill="url(#earmuffRGrad)"/>
    <!-- Subtle inner crease -->
    <path d="M 295 140 C 302 152 302 174 295 186" fill="none" stroke="#B83904" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. LEGS & BOOTS (NO OUTLINE)                             -->
  <!-- ======================================================== -->
  <g id="legs-and-boots">
    <!-- Left Leg Hose -->
    <path d="M 122 368 L 122 396 L 134 396 L 134 368 Z"
          fill="url(#metalHoseGrad)"/>
    <path d="M 122 377 L 134 377" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 122 387 L 134 387" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Right Leg Hose -->
    <path d="M 191 368 L 191 396 L 204 396 L 204 368 Z"
          fill="url(#metalHoseGrad)"/>
    <path d="M 191 377 L 204 377" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 191 387 L 204 387" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Left Ankle Cuff -->
    <rect x="116" y="394" width="24" height="6.5" rx="3.2" fill="#334155"/>
    <!-- Right Ankle Cuff -->
    <rect x="186" y="394" width="24" height="6.5" rx="3.2" fill="#334155"/>

    <!-- Left Boot -->
    <g id="left-boot">
      <!-- Dark Rubber Sole -->
      <path d="M 86 429 C 86 425 94 423 114 423 C 132 423 139 425 139 429 L 138 436 C 137 438 125 440 111 440 C 96 440 86 438 86 436 Z"
            fill="url(#bootSoleGrad)"/>
      <!-- Boot Orange Body -->
      <path d="M 116 396 L 108 410 C 103 413 96 418 89 423 C 87 426 92 429 106 429 C 124 429 137 427 138 422 C 139 417 138 409 135 396 Z"
            fill="url(#bootGrad)"/>
      <!-- Toe Gloss Highlight -->
      <path d="M 94 423 C 95 420 101 419 108 419 C 114 419 117 421 117 423 C 117 425 112 427 106 427 C 99 427 94 425 94 423 Z"
            fill="#FFAA6B" opacity="0.9"/>
      <!-- Ankle Sensor Rivet -->
      <circle cx="134" cy="413" r="3.6" fill="#1E293B"/>
      <circle cx="133" cy="412" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Right Boot -->
    <g id="right-boot">
      <!-- Dark Rubber Sole -->
      <path d="M 186 429 C 186 425 193 423 213 423 C 232 423 239 425 239 429 L 238 436 C 237 438 226 440 211 440 C 196 440 186 438 186 436 Z"
            fill="url(#bootSoleGrad)"/>
      <!-- Boot Orange Body -->
      <path d="M 189 396 C 186 409 185 417 186 422 C 187 427 200 429 218 429 C 232 429 237 426 235 423 C 229 418 222 413 217 410 L 209 396 Z"
            fill="url(#bootGrad)"/>
      <!-- Toe Gloss Highlight -->
      <path d="M 211 423 C 211 421 215 419 222 419 C 228 419 233 420 233 423 C 233 425 228 427 222 427 C 215 427 211 425 211 423 Z"
            fill="#FFAA6B" opacity="0.9"/>
      <!-- Ankle Sensor Rivet -->
      <circle cx="192" cy="413" r="3.6" fill="#1E293B"/>
      <circle cx="191" cy="412" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. ARMS: METALLIC HOSES + BLUE GLOVES (NO OUTLINE)      -->
  <!-- ======================================================== -->
  <!-- Left Arm -->
  <g id="left-arm">
    <!-- Corrugated Hose Tube -->
    <path d="M 76 270 C 58 280 40 296 32 316 C 26 332 28 348 42 360 L 53 352 C 42 342 40 328 46 317 C 52 304 66 290 82 281 Z"
          fill="url(#metalHoseGrad)"/>
    
    <!-- Arm Ring Ribs (Subtle dark separator lines) -->
    <path d="M 68 274 L 78 285" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 56 286 L 68 296" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 46 299 L 58 308" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 37 314 L 50 321" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 33 331 L 47 336" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 35 346 L 49 347" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Left Glove: Wrist at (46, 358), Body down to y=396, x: 26..75 -->
    <!-- Wrist Collar Ring -->
    <ellipse cx="46" cy="358" rx="9.5" ry="5.5" fill="#1C3556" transform="rotate(-26 46 358)"/>
    <!-- Glove Hand Palm & Fingers -->
    <path d="M 40 360 C 32 366 25 375 27 386 C 29 394 38 396 48 395 C 60 393 73 387 73 378 C 73 370 66 366 59 362 C 54 359 50 357 46 358"
          fill="url(#navyGloveGrad)"/>
    <!-- Glove Thumb pointing left -->
    <path d="M 32 370 C 23 374 22 382 28 388 C 34 391 39 387 38 380"
          fill="url(#navyGloveGrad)"/>
    <path d="M 44 381 C 48 385 54 385 58 382" fill="none" stroke="#162D4A" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Right Arm -->
  <g id="right-arm">
    <!-- Corrugated Hose Tube -->
    <path d="M 238 266 C 256 264 275 255 289 242 C 303 228 312 211 318 194 L 308 188 C 302 203 294 218 281 230 C 269 241 254 249 238 251 Z"
          fill="url(#metalHoseGrad)"/>
    
    <!-- Arm Ring Ribs -->
    <path d="M 248 251 L 248 266" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 264 244 L 268 258" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 280 234 L 287 247" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 293 220 L 303 230" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 304 204 L 315 212" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Right Glove -->
    <!-- Wrist Collar Ring -->
    <ellipse cx="313" cy="191" rx="10.5" ry="6" fill="#1C3556" transform="rotate(35 313 191)"/>
    <!-- Waving Glove Hand Body -->
    <path d="M 314 187 C 316 177 321 169 328 167 C 336 164 345 169 349 179 C 353 187 354 193 359 194 C 364 195 366 203 361 211 C 355 221 345 228 333 230 C 323 232 313 225 308 216 C 304 209 308 201 314 195"
          fill="url(#navyGloveGrad)"/>
    <!-- Waving Thumb -->
    <path d="M 314 192 C 304 190 297 182 303 175 C 309 168 317 172 321 180"
          fill="url(#navyGloveGrad)"/>
    <path d="M 326 190 C 332 194 336 203 333 211" fill="none" stroke="#162D4A" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ======================================================== -->
  <!-- 4. TORSO (NO OUTLINE)                                    -->
  <!-- ======================================================== -->
  <g id="torso">
    <path d="M 88 250 C 85 278 88 304 98 326 C 108 348 120 366 142 371 C 154 374 170 374 184 371 C 206 366 218 348 228 326 C 238 304 241 278 238 250 C 208 256 118 256 88 250 Z"
          fill="url(#torsoGrad)"/>

    <!-- Left Shoulder Dark Navy Joint -->
    <circle cx="82" cy="272" r="16" fill="#24456D"/>
    <!-- Right Shoulder Dark Navy Joint -->
    <circle cx="242" cy="264" r="16" fill="#24456D"/>

    <!-- White Glowing C-Ring / Circular Progress Icon on Belly -->
    <!-- Center: (162, 303), Radius: 21, Opening at angle 40° to 100° -->
    <g id="chest-c-ring" filter="url(#softGlow)">
      <path d="M 178 317 A 21 21 0 1 0 158 324"
            fill="none" stroke="#FFFFFF" stroke-width="6.2" stroke-linecap="round"/>
      <path d="M 178 317 A 21 21 0 1 0 158 324"
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 5. HELMET & VISOR (NO OUTLINE)                           -->
  <!-- ======================================================== -->
  <g id="helmet">
    <!-- Big Orange Outer Helmet Shell -->
    <path d="M 23 150 C 18 70 82 2 162 2 C 242 2 306 70 301 150 C 298 202 284 246 244 263 C 204 280 120 280 80 263 C 40 246 26 202 23 150 Z"
          fill="url(#helmetGrad)"/>

    <!-- Top Glossy White Reflection Curve (Upper-Right Helmet Shine) -->
    <path d="M 238 34 C 263 52 278 82 281 112 C 275 86 259 61 236 44 C 232 41 234 36 238 34 Z"
          fill="#FFFFFF" opacity="0.6"/>

    <!-- Navy Blue Visor Outer Collar / Ring -->
    <path d="M 44 148 C 40 84 92 31 161 31 C 230 31 282 84 278 148 C 275 198 230 252 161 252 C 92 252 47 198 44 148 Z"
          fill="url(#navyCollarGrad)"/>

    <!-- Warm Peach Inner Visor Bezel / Rim -->
    <path d="M 54 149 C 50 92 96 45 161 45 C 226 45 272 92 268 149 C 265 194 225 242 161 242 C 97 242 57 194 54 149 Z"
          fill="url(#peachBezelGrad)"/>

    <!-- Visor Faceplate Screen Glass (Light Blue/White) -->
    <path d="M 60 149 C 57 97 100 54 161 54 C 222 54 265 97 262 149 C 259 190 221 234 161 234 C 101 234 63 190 60 149 Z"
          fill="url(#screenGrad)"/>

    <!-- Glass Surface Specular Reflection Highlight (Upper Right Visor) -->
    <path d="M 152 61 C 196 61 236 90 248 132 C 242 99 209 73 166 69 C 156 68 148 62 152 61 Z"
          fill="#FFFFFF" opacity="0.75"/>
    <ellipse cx="236" cy="118" rx="15" ry="34" fill="#FFFFFF" opacity="0.22" transform="rotate(26 236 118)"/>

    <!-- ====================================================== -->
    <!-- 6. FACE (EYES: NO OUTLINE | MOUTH: HAS OUTLINE!)       -->
    <!-- ====================================================== -->
    <!-- Left Eye (Solid Glossy Black, No Outline) -->
    <g id="left-eye">
      <ellipse cx="106" cy="132" rx="12.5" ry="16.5" fill="#181111"/>
      <circle cx="103" cy="125" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Right Eye (Solid Glossy Black, No Outline) -->
    <g id="right-eye">
      <ellipse cx="209" cy="133" rx="12.5" ry="16.5" fill="#181111"/>
      <circle cx="206" cy="126" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Happy Smiling Open Mouth (WITH CRISP BOLD OUTLINE!) -->
    <g id="mouth">
      <!-- Mouth Cavity (Dark Outer Stroke + Deep Red Fill) -->
      <path d="M 125 159 C 143 165 177 165 195 159 C 201 178 193 205 160 205 C 127 205 119 178 125 159 Z"
            fill="#8B261D" stroke="#181111" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Mouth Deep Dark Upper Shadow Inside -->
      <path d="M 127 162 C 145 167 175 167 193 162 C 196 174 191 190 180 195 C 170 183 150 183 140 195 C 129 190 124 174 127 162 Z"
            fill="#5E1812"/>

      <!-- Pink Rounded Tongue at bottom of mouth -->
      <path d="M 132 188 C 138 178 152 178 160 185 C 168 178 182 178 188 188 C 183 199 173 204 160 204 C 147 204 137 199 132 188 Z"
            fill="#F27970" stroke="#181111" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Tongue Center Dividing Crease -->
      <path d="M 160 186 L 160 199" fill="none" stroke="#C44840" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
