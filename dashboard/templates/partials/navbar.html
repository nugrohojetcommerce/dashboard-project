<style>
.app-header {
  position: sticky;
  top: 0;
  z-index: 1030;
}

.app-header.navbar {
  background: var(--card-bg) !important;
  border-bottom: 1px solid var(--glass-border) !important;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: background .2s, border-color .2s;
}

.app-header .nav-link {
  color: var(--text-muted) !important;
  transition: color .18s;
}
.app-header .nav-link:hover {
  color: var(--orange) !important;
}

.navbar-username {
  font-size: .78rem;
  font-weight: 600;
  color: var(--text-sub) !important;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: .04em;
}

.sidebar-toggle {
  font-size: 1.1rem;
  color: var(--text-muted) !important;
  line-height: 1;
}
.sidebar-toggle:hover { color: var(--orange) !important; }
</style>

<nav class="app-header navbar navbar-expand">
    <div class="container-fluid">

        <ul class="navbar-nav">
            <li class="nav-item" style="display: flex; align-items: center; gap: 12px;">
                <a class="nav-link sidebar-toggle" data-lte-toggle="sidebar" href="#">☰</a>
                {% load static %}
                <a class="logo">
                    <img src="{% static 'jetcommerce.svg' %}" alt="Jetcommerce Logo" style="height: 30px; width: auto;">
                </a>
            </li>
        </ul>

        <ul class="navbar-nav">
            <span class ="nav-link">
                Jetcommerce Dashboard
            </span>
        </ul>

        <ul class="navbar-nav ms-auto align-items-center" style="gap: 6px;">
            <li class="nav-item">
                <label class="theme-switch">
                    <input type="checkbox" id="themeSwitchInput" onchange="BITheme.toggle()">
                    <span class="theme-switch-track">
                        <span class="theme-switch-thumb">
                            <span id="themeToggleIcon">🌙</span>
                        </span>
                    </span>
                </label>
            </li>
            <!-- <li class="nav-item"> -->
              <!-- <form action="{% url 'logout' %}" method="post" style="display: inline">
                {% csrf_token %}
                <button
                  type="submit"
                  class="nav-link navbar-username"
                  style="background: none; border: none; padding: 0; cursor: pointer"
                >
                  Logout
                </button>
              </form> -->
              <!-- <a href="{% url 'update_profile' %}" class="nav-link navbar-username">{{ request.user.username }}</a> -->
            <!-- </li> -->
        </ul>

    </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.BITheme) {
      const icon = document.getElementById('themeToggleIcon');
      const input = document.getElementById('themeSwitchInput');
      const dark = BITheme.current === 'dark';
      if (icon) icon.textContent = dark ? '☀️' : '🌙';
      if (input) input.checked = dark;
    }
  });
</script>
