<style>
.app-header {
  position: sticky;
  top: 0;
  z-index: 1030;
}

.app-header.navbar {
  background: var(--card-bg) !important;
  border-bottom: 1px solid var(--glass-border) !important;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: background .2s, border-color .2s;
  height: 56px;
  padding: 0 16px;
}

.navbar-left-group {
  display: flex;
  align-items: center;
  gap: 14px;
}

.sidebar-toggle {
  font-size: 1.15rem;
  color: var(--text-muted) !important;
  line-height: 1;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  transition: all .18s;
  cursor: pointer;
}
.sidebar-toggle:hover {
  color: var(--orange) !important;
  background: var(--glass-hover);
}

.navbar-page-title {
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--text-primary) !important;
  letter-spacing: -.25px;
  line-height: 1.2;
  margin: 0;
}

#themeToggleIcon {
  font-size: 0.65rem;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s ease, transform 0.2s ease;
}
</style>

<nav class="app-header navbar navbar-expand">
    <div class="container-fluid px-1">

        <div class="navbar-left-group">
            <a class="sidebar-toggle" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle navigation">☰</a>
            <h1 class="navbar-page-title" id="navbarPageHeading">
                {% if "/brand_performance_v2/analytics" in request.path %}
                    Performance &amp; SKU Analytics
                {% elif "/brand_performance_v2" in request.path %}
                    Brand &amp; Platform Performance
                {% elif "/order_mart" in request.path %}
                    Periodic Reports
                {% else %}
                    Sales Dashboard
                {% endif %}
            </h1>
        </div>

        <ul class="navbar-nav ms-auto align-items-center" style="gap: 6px;">
            <li class="nav-item">
                <label class="theme-switch" title="Toggle theme">
                    <input type="checkbox" id="themeSwitchInput" onchange="BITheme.toggle()">
                    <span class="theme-switch-track">
                        <span class="theme-switch-thumb">
                            <i id="themeToggleIcon" class="bi bi-moon-stars-fill" style="color: #64748B;"></i>
                        </span>
                    </span>
                </label>
            </li>
        </ul>

    </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.BITheme) {
      const icon = document.getElementById('themeToggleIcon');
      const input = document.getElementById('themeSwitchInput');
      const dark = BITheme.current === 'dark';
      if (icon) {
        icon.className = dark ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        icon.style.color = dark ? '#F59E0B' : '#64748B';
      }
      if (input) input.checked = dark;
    }
  });
</script>
