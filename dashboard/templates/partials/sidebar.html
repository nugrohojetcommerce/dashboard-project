<style>
  /* ── SIDEBAR — theme-aware, matches app design tokens ── */
  .app-sidebar {
    background: var(--card-bg) !important;
    border-right: 1px solid var(--glass-border) !important;
    box-shadow: 6px 0 24px rgba(0, 0, 0, 0.03) !important;
    /* transition: background .2s, border-color .2s; */
  }

  .sidebar-brand {
    padding: 18px 24px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
  }

  .brand-link .brand-text {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary) !important;
    letter-spacing: -.2px;
  }

  .sidebar-wrapper {
    padding: 0 12px;
  }

  .app-sidebar .nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    margin: 6px 0;
    border-radius: 8px;
    color: var(--text-sub) !important;
    font-size: .87rem;
    font-weight: 500;
    border: 1px solid transparent;
    background: transparent;
    transition: all 0.15s ease;
  }

  .app-sidebar .nav-link:hover {
    background: var(--glass-hover) !important;
    color: var(--orange) !important;
    border-color: var(--glass-border);
    transform: translateX(2px);
  }

  .app-sidebar .nav-link.active {
    background: var(--orange-dim) !important;
    border-color: var(--glass-border-h) !important;
    color: var(--orange) !important;
    font-weight: 600;
  }

  .app-sidebar .nav-icon {
    font-size: 1.1rem;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
    color: inherit !important;
  }

  .app-sidebar .nav-link p {
    margin: 0;
    color: inherit;
  }

  .app-sidebar[data-bs-theme="dark"] {
    --bs-body-color: var(--text-primary);
    --bs-body-bg: var(--card-bg);
  }
</style>

<aside class="app-sidebar shadow-sm">

    <div class="sidebar-brand">
        <!-- <a href="/" class="brand-link text-decoration-none d-flex align-items-center">
            <span class="brand-text">
                BI Dashboard
            </span>
        </a> -->
        <a href="{% url 'update_profile' %}" class="brand-link text-decoration-none d-flex align-items-center">
          <span class="brand-text">Hello, {{ request.user.first_name }} {{ request.user.last_name }}</span>
        </a>
    </div>

    <div class="sidebar-wrapper">
        <nav class="mt-3">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">                
              <li class="nav-item">
                  <a href="/brand_performance/" class="nav-link {% if request.path == '/brand_performance/' %}active{% endif %}">
                      <i class="nav-icon bi bi-bar-chart"></i>
                      <p>Brand Performance</p>
                  </a>
              </li>
              <li class="nav-item">
                  <a href="/consolidate_sales/" class="nav-link {% if request.path == '/consolidate_sales/' %}active{% endif %}">
                      <i class="nav-icon bi bi-graph-up"></i>
                      <p>Consolidated Sales</p>
                  </a>
              </li>
              <li class="nav-item">
                  <a href="/dashboard_insight/" class="nav-link {% if request.path == '/dashboard_insight/' %}active{% endif %}">
                      <i class="nav-icon bi bi-lightbulb"></i>
                      <p>Brand Insight</p>
                  </a>
              </li>
              <li class="nav-item">
                  <a href="/ads_dashboard/" class="nav-link {% if request.path == '/ads_dashboard/' %}active{% endif %}">
                      <i class="nav-icon bi bi-megaphone"></i>
                      <p>Ads Dashboard</p>
                  </a>
              </li>
            </ul>
        </nav>
    </div>

</aside>
