{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      
      <div class="card shadow-sm border-0 p-4" style="background: var(--card-bg); color: var(--text-main); border: 1px solid var(--glass-border) !important;">
        <h2 class="h4 mb-4 fw-bold" style="color: var(--text-main);">Change Your Password</h2>

        {% if messages %} 
          {% for message in messages %}
            <div class="alert alert-dismissible fade show d-flex align-items-center justify-content-between" role="alert" style="background: var(--card-bg); color: var(--orange); border: 1px solid var(--glass-border);">
              <div>{{ message }}</div>
              <button type="button" class="btn-close" style="filter: invert(1);" aria-label="Close" onclick="this.closest('.alert').remove()"></button>
            </div>
          {% endfor %} 
        {% endif %}

        <form method="post" class="needs-validation" novalidate>
          {% csrf_token %}
          
          <div class="mb-3 custom-engine-form">
            {{ form.as_p }}
          </div>

          <div class="d-flex align-items-center justify-content-between mt-4">
            <button type="submit" class="btn btn-primary px-4" style="background-color: var(--orange); border-color: var(--orange);">Update Password</button>
            <a href="{% url 'update_profile' %}" class="text-decoration-none" style="color: var(--orange);">Back to Profile</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<script>
    window.addEventListener('pageshow', function (event) {
        const passwordFields = document.querySelectorAll('input[type="password"]');
        passwordFields.forEach(field => {
            field.value = '';
        });
    });
</script>

<style>
  .custom-engine-form p {
    margin-bottom: 1.25rem;
  }
  .custom-engine-form label {
    display: block;
    margin-bottom: 0.3rem;
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .custom-engine-form input {
    display: block;
    width: 100%;
    padding: 0.375rem 0.75rem;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text-main);
    background-color: var(--card-bg);
    background-clip: padding-box;
    border: 1px solid var(--glass-border);
    border-radius: 0.375rem;
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
  }
  .custom-engine-form input:focus {
    color: var(--text-main);
    background-color: var(--card-bg);
    border-color: var(--orange);
    outline: 0;
    box-shadow: 0 0 0 0.25rem rgba(255, 107, 0, 0.25);
  }
  .custom-engine-form ul, .custom-engine-form .helptext {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.3rem;
    padding-left: 1.2rem;
  }
</style>
{% endblock %}
